name: Update market data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch Finnhub quotes
        run: node scripts/update-market-data.mjs
        env:
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
      - name: Fetch public channel snapshots
        run: node scripts/update-channel-data.mjs
        env:
          SHOP_FEED_URL: ${{ vars.SHOP_FEED_URL }}
      - name: Commit live snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add airport-channel/data.json market-data/quotes.json retro-shopping/products.json
          git diff --cached --quiet || git commit -m "update market data"
          git push
          git push origin HEAD:gh-pages --force-with-lease
          gh api "repos/${GH_REPO}/pages/builds" -X POST
