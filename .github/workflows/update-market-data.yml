name: Update market data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch Finnhub quotes
        run: node scripts/update-market-data.mjs
        env:
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
      - name: Commit quote snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-data/quotes.json
          git diff --cached --quiet || git commit -m "update market data"
          git push
