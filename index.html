<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JMO Visualizers</title>
    <style>
      :root {
        color-scheme: dark;
        background: #05060a;
        color: #e8fbff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(89, 214, 255, 0.16), transparent 32%),
          linear-gradient(135deg, #05060a, #080914 64%, #000000);
      }

      main {
        width: min(92vw, 720px);
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(34px, 8vw, 76px);
        line-height: 0.94;
        letter-spacing: 0;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        margin-right: 10px;
        margin-bottom: 10px;
        padding: 0 16px;
        border: 1px solid rgba(142, 239, 255, 0.46);
        border-radius: 8px;
        color: #e8fbff;
        background: rgba(142, 239, 255, 0.08);
        text-decoration: none;
        font-weight: 700;
      }

      a:focus,
      a:hover {
        border-color: rgba(255, 255, 255, 0.82);
        background: rgba(142, 239, 255, 0.16);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>JMO Visualizers</h1>
      <a href="./starfield/">Starfield</a>
      <a href="./fish-tank/">Fish Tank</a>
      <a href="./weather-radar/">Weather Radar</a>
    </main>
  </body>
</html>
