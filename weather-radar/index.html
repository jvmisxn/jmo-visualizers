<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JMO Weather</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="./styles.css?v=radar-legend-1">
  </head>
  <body>
    <main class="frame">
      <section id="map" aria-label="Weather map"></section>

      <div class="scanlines"></div>
      <div class="vignette"></div>

      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">JMO</span>
          <span class="brand-title">Weather Scan</span>
        </div>
        <div id="mode" class="mode">LOCAL FORECAST</div>
        <div class="clock-block">
          <div id="clock" class="clock">--:-- PT</div>
          <div id="clock-date" class="clock-date">--</div>
        </div>
      </header>

      <aside class="forecast-panel">
        <div id="region" class="region">Loading map...</div>
        <div class="conditions-row">
          <div>
            <div id="temperature" class="temperature">--</div>
            <div id="condition" class="condition">Gathering conditions</div>
          </div>
          <div class="metric-stack">
            <span id="wind">Wind --</span>
            <span id="precip">Humidity --</span>
            <span id="updated">Updated --</span>
            <span id="local-time">Local --</span>
          </div>
        </div>
        <div class="daily-header">Extended Forecast</div>
        <div id="daily" class="daily"></div>
      </aside>

      <aside id="camera-panel" class="camera-panel" aria-label="Public traffic camera" hidden>
        <div class="camera-header">
          <span>LIVE CAMERA</span>
          <span id="camera-source">WSDOT</span>
        </div>
        <img id="camera-image" alt="">
        <div class="camera-footer">
          <span id="camera-location">Camera loading</span>
          <span id="camera-updated">--</span>
        </div>
      </aside>

      <section class="lower-third">
        <div>
          <div id="now-viewing" class="kicker">NOW VIEWING</div>
          <div id="summary" class="summary">Weather map initializing</div>
        </div>
        <div id="radar-stamp" class="radar-stamp">RADAR: LIVE</div>
      </section>

      <aside id="radar-legend" class="radar-legend" aria-hidden="true" hidden>
        <span class="legend-title">PRECIP</span>
        <span class="legend-scale">
          <span class="legend-bar"></span>
          <span class="legend-ends"><span>LIGHT</span><span>HEAVY</span></span>
        </span>
      </aside>

      <footer class="ticker">
        <div id="ticker-text" class="ticker-text">
          DATA: NOAA/NWS, Open-Meteo, CARTO/OpenStreetMap
        </div>
      </footer>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./app.js?v=humidity-slot-1"></script>
  </body>
</html>
